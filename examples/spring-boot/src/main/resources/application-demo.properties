# 演示 profile：信任 X-Demo-User / X-Demo-Tenant 请求头作为身份来源（可选 X-Demo-Trace）。
#
# 只在演示与测试里激活：mvn spring-boot:run -Dspring-boot.run.profiles=demo
# 为什么单独一个文件而不是放进 application.properties：
#   请求头是调用方可任意伪造的输入，拿它当身份等于把认证交给调用方自己填。
#   放进主配置 = 这段代码路径跟着 classpath 一起进生产，只是被一个 @Value 开关关着——
#   线上只要有人手滑把这个键设成 true，门禁就没了。
demo.trust-request-headers=true
