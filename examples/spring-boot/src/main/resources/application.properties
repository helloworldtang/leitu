spring.datasource.username=sa
spring.datasource.password=
leitu.openapi.title=订单服务（示例）
leitu.openapi.version=0.1.0

# 演示开关**不在这里**——它在 application-demo.properties，只有 --spring.profiles.active=demo 才加载。
# 放主配置等于把「请求头当身份」带进生产：请求头是调用方可任意伪造的输入，
# 拿它当身份等于把认证交给调用方自己填。默认（不激活 profile）一致匿名，
# 匿名不参与角色判定 → 403，失败方向在安全侧（DemoIdentityDefaultTest 守着这个方向）。
