spring.datasource.url=jdbc:h2:mem:leitu-demo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
leitu.openapi.title=订单服务（示例）
leitu.openapi.version=0.1.0

# 演示开关：信任 X-Demo-User / X-Demo-Tenant 请求头作为身份来源。
# 仅为让本示例的端到端演示跑得通而开。生产必须删掉这一行：
# 请求头是调用方可任意伪造的输入，拿它当身份等于把认证交给调用方自己填。
# 不开启时一律匿名，而匿名不参与角色判定（403）——失败方向是安全侧。
demo.trust-request-headers=true
