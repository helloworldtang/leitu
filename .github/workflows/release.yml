name: release
# 发布到 Maven Central（Central Portal）。前置条件（GitHub Secrets）：
#   CENTRAL_USERNAME / CENTRAL_PASSWORD —— central.sonatype.com 的 User Token
#   GPG_PRIVATE_KEY / GPG_PASSPHRASE     —— 签名密钥
# 未配置 Secrets 时此工作流会失败——属预期（凭据就绪前不发布）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
      # 构建走项目级 .mvn/settings.xml（阿里云镜像），Central 凭据需注入同一份 settings（-s 会覆盖 ~/.m2）
      - name: 注入 Central 凭据
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          sed -i "s#</mirrors>#</mirrors>\n  <servers>\n    <server>\n      <id>central</id>\n      <username>\${CENTRAL_USERNAME}</username>\n      <password>\${CENTRAL_PASSWORD}</password>\n    </server>\n  </servers>#" .mvn/settings.xml
          grep -A4 '<id>central</id>' .mvn/settings.xml
      # 版本闸门（#23）：tag 必须与 pom 版本一致，且不得是 SNAPSHOT。
      # 少了这道闸，① 打错 tag（v0.2.1 而 pom 还是 0.2.0）会把错误版本推上 Central，
      # 而组件一旦发布就不可撤回、版本号也不可复用；② 把 SNAPSHOT 推上 Portal，校验会拒收。
      # 校验脚本与本地自检共用同一份（scripts/check-release-version.sh），流程里不另抄一遍逻辑。
      - name: 校验 tag 与 pom 版本一致（且非 SNAPSHOT）
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            scripts/check-release-version.sh "${GITHUB_REF#refs/tags/}"
          else
            echo "手动触发：跳过 tag 比对，只校验非 SNAPSHOT"
            scripts/check-release-version.sh
          fi
      # setup-java 把私钥 import 到一个临时目录并 export 了 GNUPGHOME；那个目录是新建的空目录，
      # 里面没有 gpg-agent.conf。而 pom 的 release profile 给 maven-gpg-plugin 固定传了
      # --pinentry-mode loopback，gpg-agent 默认禁止调用方覆盖 pinentry。
      # 注：本机 gpg 2.5.20 实测不加也能过（命令行显式给了 --passphrase 时 agent 会放行），
      # 但 CI runner 上是 Ubuntu 自带的 gpg（版本不同），历史上该选项是必需项，故显式加上。
      - name: 允许 loopback pinentry（CI 无 TTY）
        run: |
          GNUPGHOME_DIR="${GNUPGHOME:-$HOME/.gnupg}"
          mkdir -p "$GNUPGHOME_DIR" && chmod 700 "$GNUPGHOME_DIR"
          grep -q '^allow-loopback-pinentry$' "$GNUPGHOME_DIR/gpg-agent.conf" 2>/dev/null \
            || echo "allow-loopback-pinentry" >> "$GNUPGHOME_DIR/gpg-agent.conf"
          gpgconf --homedir "$GNUPGHOME_DIR" --kill gpg-agent || true
      # 发布集合：leitu-parent(pom) + 库模块（core / rules / 三能力 / 两适配 / starter）；examples 不发布。
      # 密码环境变量必须是 MAVEN_GPG_PASSPHRASE：maven-gpg-plugin 3.2.7 的 passphraseEnvName
      # 默认值就是它，写成 GPG_PASSPHRASE 时插件读不到密码，会回落到 gpg-agent —— 而 CI 上的
      # agent 既无缓存又无 TTY，最终卡在 pinentry 上超时失败。（构建走 .mvn/maven.config 里的
      # -s .mvn/settings.xml，setup-java 生成到 ~/.m2/settings.xml 的那份不生效，别指望它兜底。）
      - name: Publish to Maven Central
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -P release -pl .,leitu-core,leitu-rules,leitu-capability-access,leitu-capability-data,leitu-capability-cache,leitu-spring-boot-starter,leitu-adapter-jdbc,leitu-adapter-web deploy
