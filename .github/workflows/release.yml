name: release
# 发布到 Maven Central（Central Portal）。前置条件（GitHub Secrets）：
#   CENTRAL_USERNAME / CENTRAL_PASSWORD —— central.sonatype.com 的 User Token
#   GPG_PRIVATE_KEY / GPG_PASSPHRASE     —— 签名密钥
# 未配置 Secrets 时此工作流会失败——属预期（凭据就绪前不发布）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
      # 构建走项目级 .mvn/settings.xml（阿里云镜像），Central 凭据需注入同一份 settings（-s 会覆盖 ~/.m2）
      - name: 注入 Central 凭据
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          sed -i "s#</mirrors>#</mirrors>\n  <servers>\n    <server>\n      <id>central</id>\n      <username>\${CENTRAL_USERNAME}</username>\n      <password>\${CENTRAL_PASSWORD}</password>\n    </server>\n  </servers>#" .mvn/settings.xml
          grep -A4 '<id>central</id>' .mvn/settings.xml
      # 版本闸门（#23）：tag 必须与 pom 版本一致，且不得是 SNAPSHOT。
      # 少了这道闸，① 打错 tag（v0.2.1 而 pom 还是 0.2.0）会把错误版本推上 Central，
      # 而组件一旦发布就不可撤回、版本号也不可复用；② 把 SNAPSHOT 推上 Portal，校验会拒收。
      # 校验脚本与本地自检共用同一份（scripts/check-release-version.sh），流程里不另抄一遍逻辑。
      - name: 校验 tag 与 pom 版本一致（且非 SNAPSHOT）
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            scripts/check-release-version.sh "${GITHUB_REF#refs/tags/}"
          else
            echo "手动触发：跳过 tag 比对，只校验非 SNAPSHOT"
            scripts/check-release-version.sh
          fi
      # 发布集合：leitu-parent(pom) + 库模块（core / rules / 三能力 / 两适配 / starter）；examples 不发布
      - name: Publish to Maven Central
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./mvnw -B -P release -pl .,leitu-core,leitu-rules,leitu-capability-access,leitu-capability-data,leitu-capability-cache,leitu-spring-boot-starter,leitu-adapter-jdbc,leitu-adapter-web deploy
