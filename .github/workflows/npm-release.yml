name: npm-release
# 发布 AI 消费入口 CLI（tools/cli）到 npm。
# 前置条件（GitHub Secrets）：NPM_TOKEN —— npmjs.com 的 Granular Access Token（leitu-cli 读写）。
#
# 两条版本线，互不影响（不要把它们绑在一起）：
#   · **leitu 库版本（Maven）—— 有语义的那条线**：真源 = 根 pom 的 <version>；
#     它由 skills/leitu/SKILL.md 承载给 AI（新项目引哪个版本看这份文件），
#     由守门人 tools/cli/check-skill.mjs 强制两者相等。发布 = 打 `v<x.y.z>` tag（release.yml）。
#   · **npm CLI 版本 —— 无状态工具，没有语义**：CLI 只读一份 catalog 快照，版本不承载
#     兼容性承诺，所以想发就发、不必等库版本；用的人一律取最新（`npx leitu-cli@latest`）。
#     发布 = 打 `cli-v<x.y.z>` tag（本工作流）。改了 catalog 快照就顺手发一次。
#
# 本仓库里 `v*` 已被 Maven 占（release.yml），故 CLI 用 `cli-v*`；两个过滤器互不匹配
# （`v*` 不以 c 开头，`cli-v*` 不以数字开头）。发布姿势：
#   git tag cli-v<x.y.z> && git push origin cli-v<x.y.z>
#
# 安全试跑：Actions 页面 dispatch 本工作流并勾 dry_run —— 只跑自检与打包，不发布。
#
# 发版可见信号三重（写这一段是因为 exomind-cli v0.17.0「发布成功但没人知道」：
# Actions 成功默认不发邮件、npm 也不发，Releases 页又长期为空）：
#   ① 自动建 GitHub Release（Releases 页有条目 + 通知邮件）
#   ② 本工作流 Summary 打出版本与包页面
#   ③ 发布后轮询 registry 确认版本真的可见（看得见才算发成功）
on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只跑自检与打包，不发布（验证工作流用）'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发布成功后自动建 GitHub Release
      id-token: write # npm provenance（供应链溯源）
    defaults:
      run:
        working-directory: tools/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # 上传前把「发了才发现」的问题挡住：tag↔版本一致（本工作流 tag 前缀 cli-v）、bin 有效
      # （npm 会静默剥掉带 './' 前缀的 bin）、files 覆盖入口、版本未被 registry 占用。
      - name: 发布前置自检
        run: node preflight.mjs --tag-prefix=cli-v ${{ inputs.dry_run && '--allow-published' || '' }}
      - name: 发布到 npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # 「发成功了但拉不到」必须知道——所以不靠 npm publish 的退出码，去 registry 复核。
      - name: 确认版本已在 registry 可见
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        run: |
          V=$(npm pkg get version | tr -d '"')
          for i in $(seq 1 18); do
            if [ "$(npm view "leitu-cli@$V" version 2>/dev/null || true)" = "$V" ]; then
              echo "registry 已可见：leitu-cli@$V（第 $((i*10)) 秒内）"
              exit 0
            fi
            sleep 10
          done
          echo "::error::发布后 3 分钟内 registry 未见到 leitu-cli@$V，请用 npm view 复核（可能只是传播延迟）"
          exit 1
      - name: 建 GitHub Release（发版可见信号）
        if: ${{ github.event_name == 'push' && !inputs.dry_run }}
        run: gh release create "$GITHUB_REF_NAME" --title "leitu-cli ${GITHUB_REF_NAME#cli-v}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 结果写进 Summary
        if: always()
        run: |
          V=$(npm pkg get version | tr -d '"')
          {
            echo "### 发布：\`${GITHUB_REF_NAME}\`"
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "> **dry run**：只跑了自检与打包，未发布。"
              echo ""
            fi
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| npm CLI 版本 | \`$V\` |"
            echo "| registry 当前版本 | \`$(npm view leitu-cli version 2>/dev/null || echo '查询失败')\` |"
            echo "| 包页面 | https://www.npmjs.com/package/leitu-cli |"
            echo ""
            echo "> CLI 是无状态工具、版本无兼容性承诺：用的人一律 \`npx leitu-cli@latest\`。"
            echo "> leitu **库**版本是另一条线（真源 = 根 pom 的 \`<version>\`，同步在 \`skills/leitu/SKILL.md\`），"
            echo "> 由 \`v<x.y.z>\` tag 触发 release.yml，与本次发布无关。"
          } >> "$GITHUB_STEP_SUMMARY"
