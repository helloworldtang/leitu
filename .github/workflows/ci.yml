name: verify
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # SKILL.md 防漂移：引用路径失效 / answered 条目被路由漏掉 / npm 快照与 catalog 不一致 /
      # **SKILL.md 里的 leitu 库版本 ≠ 根 pom 的 <version>**。放最前面：零依赖、秒级，也最该早红
      # （AI 靠 SKILL.md 决定新项目引哪个版本，写着旧版本就是静默把人引到旧版）。
      # 注意这里管的是**库版本**；npm CLI 的版本不在校验范围——CLI 一律取最新。
      - run: node tools/cli/check-skill.mjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      # eval 参考解（#25）：这是"规则在下游真的有效"唯一可执行的证据，此前它从不参与任何构建——
      # 一个从未被执行过的答案，等于没有答案。跑 -P eval 会把它拉进 reactor 一起 verify。
      - run: ./mvnw -B -P eval verify
      # 防漂移：重新生成 4R 视图，与提交版本不一致即失败（AI 资产进 CI）
      - run: java scripts/ExportArchitecture.java
      - run: git diff --exit-code docs/architecture
